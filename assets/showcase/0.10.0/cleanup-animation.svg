<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Notewll 0.10.0 — speak naturally</title><desc id="desc">Local dictation, voice notes and meeting transcripts for Windows. Illustration of repeated words becoming a clearer sentence.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#141026"/><stop offset="1" stop-color="#25213e"/></linearGradient><radialGradient id="moon"><stop stop-color="#e8e5f4"/><stop offset="1" stop-color="#81779c"/></radialGradient></defs><style>@keyframes showResult{0%,20%{opacity:.25}40%,100%{opacity:1}}@keyframes orbit{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}.result{animation:showResult 4s ease-in-out 1 forwards}.brand{animation:orbit 4s ease-in-out 1 forwards}@media(prefers-reduced-motion:reduce){.result,.brand{animation:none}}</style><rect width="1200" height="675" rx="28" fill="url(#bg)"/><g fill="#d2c2ff"><circle cx="65" cy="63" r="7"/><circle cx="88" cy="63" r="7"/><circle cx="111" cy="63" r="7"/><circle cx="134" cy="63" r="7"/></g><text x="158" y="72" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="700">Notewll</text><text x="1140" y="70" text-anchor="end" fill="#d2c2ff" font-family="Segoe UI,Arial,sans-serif" font-size="19">0.10.0 · WINDOWS PREVIEW</text><text x="62" y="177" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="62" font-weight="700">Speak naturally.</text><text x="62" y="250" fill="#d2c2ff" font-family="Segoe UI,Arial,sans-serif" font-size="53" font-weight="700">Keep the words that matter.</text><text x="64" y="300" fill="#bdb9cf" font-family="Segoe UI,Arial,sans-serif" font-size="23">Local dictation. Voice notes. Conversations you can return to.</text><rect x="62" y="353" width="1076" height="215" rx="19" fill="#f8f6ff"/><text x="88" y="390" fill="#766789" font-family="Segoe UI,Arial,sans-serif" font-size="17">SPOKEN RESTART · ANIMATED ILLUSTRATION</text><text x="88" y="438" fill="#8b6572" font-family="Segoe UI,Arial,sans-serif" font-size="31">What's the what's the best restaurant near me?</text><path d="M88 461h1000" stroke="#ddd6eb"/><text class="result" x="88" y="514" fill="#312642" font-family="Segoe UI,Arial,sans-serif" font-size="33" font-weight="600">What's the best restaurant near me?</text><text x="64" y="623" fill="#c7bfd9" font-family="Segoe UI,Arial,sans-serif" font-size="20">No account for the desktop app · Standard speech works offline</text><text x="1137" y="623" text-anchor="end" fill="#d2c2ff" font-family="Segoe UI,Arial,sans-serif" font-size="20">myhai.org</text></svg>