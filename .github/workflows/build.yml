name: Build Windows preview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build application and installer
        shell: powershell
        run: ./scripts/build_setup.ps1
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check local features
        shell: powershell
        run: python -m pytest tests -q -k "not test_live_default_microphone and not test_live_missing_named and not test_live_holly and not test_live_actual_keyboard"
      - name: Prepare update metadata
        shell: powershell
        run: ./scripts/prepare_release.ps1 -Repository '${{ github.repository }}'
      - uses: actions/upload-artifact@v4
        with:
          name: Notewll-Windows-preview
          path: |
            dist/Notewll-Setup-0.11.0.exe
            dist/update.json
            dist/RELEASE_NOTES-0.11.0.md
